# Application Configuration
spring.application.name=RoomCare Backend
server.port=8080
spring.profiles.active=dev

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/RoomCare?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:RoomCareSecretKeyForJWTTokenGenerationAndValidation2024VeryLongSecretKey}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Logging Configuration
logging.level.root=INFO
logging.level.com.roomcare.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Encoding
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Jackson Configuration (JSON)
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false

# Gmail SMTP Configuration (configure via environment variables - never hardcode secrets)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Twilio Verify / SMS OTP Configuration (configure via environment variables - never hardcode secrets)
roomcare.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
roomcare.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
roomcare.sms.twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}
roomcare.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
roomcare.sms.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}
roomcare.sms.twilio.timeout-seconds=${TWILIO_TIMEOUT_SECONDS:10}

# RoomCare Email & SMS OTP Lifecycle Policies
roomcare.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
roomcare.mail.from-name=${MAIL_FROM_NAME:RoomCare}
roomcare.auth.otp-expiration-minutes=${AUTH_OTP_EXPIRATION_MINUTES:5}
roomcare.auth.otp-resend-cooldown-seconds=${AUTH_OTP_RESEND_COOLDOWN_SECONDS:60}
roomcare.auth.otp-max-requests-per-hour=${AUTH_OTP_MAX_REQUESTS_PER_HOUR:5}
roomcare.auth.otp-max-requests-per-ip-per-hour=${AUTH_OTP_MAX_REQUESTS_PER_IP_PER_HOUR:20}
roomcare.auth.otp-max-attempts=${AUTH_OTP_MAX_ATTEMPTS:5}
roomcare.auth.token-pepper=${AUTH_TOKEN_PEPPER:${jwt.secret}}
roomcare.auth.app-base-url=${APP_BASE_URL:http://localhost:8080}
